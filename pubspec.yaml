name: ho_so_suc_khoe
description: "Ứng dụng quản lý hồ sơ sức khỏe và lịch sử theo dõi chỉ số sức khỏe"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  freezed_annotation: ^3.1.0

  # Điều hướng — ghim 11.1.0 vì 11.2.0 chuyển sang gói material_ui, không
  # tương thích với `package:flutter/material.dart` mà app và fl_chart đang dùng.
  auto_route: 11.1.0

  # Dependency injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  dartz: ^0.10.1
  intl: ^0.20.3

  # Giao diện
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.16.1
  auto_route_generator: ^10.6.0
  injectable_generator: ^3.1.3
  freezed: ^4.0.1

  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

# Sinh icon app cho iOS/Android: dart run flutter_launcher_icons
# (ảnh nguồn được vẽ bởi tool/tao_icon_test.dart)
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#0F8F84"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24

flutter:
  uses-material-design: true

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    # Icon Phosphor (MIT) — xem lib/core/theme/app_icons.dart
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Bold.ttf
